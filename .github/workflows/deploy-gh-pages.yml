# GitHub Actions Workflow: Build & Deploy to GitHub Pages

name: Deploy to GitHub Pages

# Trigger bei Push auf public-release Branch
on:
  push:
    branches:
      - public-release
    paths:
      - 'src/**'
      - 'public/**'
      - 'WP_Check_Methode_v1_ts_export/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-gh-pages.yml'

  workflow_dispatch:  # Erlaubt manuelles Auslösen auf jedem Branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Notwendig für gh-pages Push

    steps:
      # Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.js installieren
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Dependencies installieren
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Angular App bauen mit base-href für GitHub Pages
      - name: Build Angular app
        run: npm run build -- --base-href /uba-waermepumpen/

      # Versionsnummer generieren
      - name: Generate version identifier
        id: version
        run: |
          VERSION=$(date +%Y-%m-%d)-$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      # Deploy auf GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/uba-waermepumpen/browser
          publish_branch: gh-pages
          commit_message: 'Deploy v${{ steps.version.outputs.VERSION }} from ${{ github.ref_name }}'
