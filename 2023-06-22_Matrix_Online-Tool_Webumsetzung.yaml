    \ aus dem Fuhrpark verwendet oder sonst gemietet werden. Bei regelm\xE4\xDFigen\
    \ aufw\xE4ndigen Transportanforderungen ist allerdings ohnehin ein Van oder ein\
    \ Fahrzeug der Rubrik Utilities (Hochdachkombis, Kleinbusse und Pick-ups, die\
