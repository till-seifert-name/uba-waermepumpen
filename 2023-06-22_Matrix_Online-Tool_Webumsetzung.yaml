  B10: "Erlaubt die Terminplanung Fahrtunterbrechungen von mind. 20-40 min an Standorten\
    \ mit (Schnell-)Ladem\xF6glichkeiten, ist ein E-Auto (BEV - rein batteriebetrieben)\
    \ trotz h\xE4ufiger l\xE4ngerer Strecken bevorzugt zu beschaffen. "
  B11: "Ein E-Auto (BEV - rein batteriebetrieben) mit gro\xDFer Reichweite ist ggf.\
    \ geeignet. In h\xF6heren Preissegmenten ist eine Reichweite von 300 km g\xE4\
    ngig. Es sollte jedoch beachtet werden, dass dem Umweltvorteil eines BEV in der\
    \ Nutzung die Herstellungsemissionen einer gro\xDFen Batterie gegen\xFCberstehen.\
    \ Zudem sind gro\xDFe Batterien vor allem in gr\xF6\xDFeren Fahrzeugen verbaut.\
    \ Ein kleinerer, m\xF6glichst sparsamer Verbrenner kann in diesem Anwendungsfall\
    \ aus Umweltsicht (und aus Kostensicht ohnehin) also durchaus vorteilhaft sein."
  B12: "Erlaubt die Terminplanung auf langen Strecken keine bzw. nur sehr kurze Fahrtunterbrechungen\
    \ unter 30 min, ist die Beschaffung eines E-Autos nicht sinnvoll. In diesem Fall\
    \ sollte ein m\xF6glichst sparsamer Verbrenner beschafft werden."
  B13: "Bei vielen langen Strecken, auf denen keine Ladem\xF6glichkeit besteht, ist\
    \ die Beschaffung eines E-Autos nicht sinnvoll. In diesem Fall sollte ein m\xF6\
    glichst sparsamer Verbrenner beschafft werden."
  B14: "Bei vielen langen Strecken, auf denen keine Ladem\xF6glichkeit besteht, ist\
    \ die Beschaffung eines E-Autos nicht sinnvoll. In diesem Fall sollte ein m\xF6\
    glichst sparsamer Verbrenner beschafft werden. \n\nDas Fahrprofil mit regelm\xE4\
    \xDFigen l\xE4ngeren Fahrtunterbrechungen eignet sich an sich allerdings f\xFC\
    r E-Autos. Der weitere Ausbau der \xF6ffentlichen Ladeinfrastruktur oder die Wahl\
    \ von Alternativrouten mit verf\xFCgbaren Lades\xE4ulen kann also (in Zukunft)\
    \ eine E-Auto-Beschaffung durchaus erm\xF6glichen. "
  B16: Empfehlung zum Fahrzeugsegment
  B17: "Bei regelm\xE4\xDFigen aufw\xE4ndigen Transportanforderungen ist ein Van oder\
    \ ein Fahrzeug der Rubrik Utilities (Hochdachkombis, Kleinbusse und Pick-ups,\
    \ die als Pkw zugelassen sind) notwendig."
  B18: "F\xFCr die Leitungsebene besteht ggf. Anspruch auf ein Fahrzeug aus einem\
    \ h\xF6heren Fahrzeugsegment. Trotzdem sollte aus Umweltgr\xFCnden abgewogen werden,\
    \ ob ein kleineres Fahrzeug geeignet ist und die Leitungsebene freiwillig auf\
    \ diesen Anspruch verzichtet. "
  B19: "Aus Umweltsicht sollte bei einer Nutzung des Fahrzeugs durch max. zwei Personen\
    \ idealerweise ein Kleinstwagen beschafft werden. Ist mehr Komfort und/oder Stauraum\
    \ n\xF6tig, sollte genau abgewogen werden, welches Segment den Umweltanspr\xFC\
    chen und der Vorbildfunktion der Institution entspricht."
  B20: "Aus Umweltsicht sollte bei einer Nutzung des Fahrzeugs durch max. zwei Personen\
    \ idealerweise ein Kleinstwagen beschafft werden. Ist (gerade bei vielen l\xE4\
    ngeren Strecken) mehr Komfort und/oder Stauraum n\xF6tig, sollte genau abgewogen\
    \ werden, welches Segment den Umweltanspr\xFCchen und der Vorbildfunktion der\
    \ Institution entspricht."
  B21: "Werden nur selten mehr als zwei Sitzpl\xE4tze ben\xF6tigt, sollte aus Umweltsicht\
    \ bevorzugt ein Kleinwagen beschafft werden. Ist mehr Komfort und/oder Stauraum\
    \ n\xF6tig, sollte genau abgewogen werden, welches Segment den Umweltanspr\xFC\
    chen und der Vorbildfunktion der Institution entspricht."
  B22: "Werden nur selten mehr als zwei Sitzpl\xE4tze ben\xF6tigt, sollte aus Umweltsicht\
    \ bevorzugt ein Kleinwagen beschafft werden. Ist (gerade bei vielen l\xE4ngeren\
    \ Strecken) mehr Komfort und/oder Stauraum n\xF6tig, sollte genau abgewogen werden,\
    \ welches Segment den Umweltanspr\xFCchen und der Vorbildfunktion der Institution\
    \ entspricht."
  B23: "Werden h\xE4ufig mehr als zwei Sitzpl\xE4tze ben\xF6tigt, sollte aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Ist mehr Komfort\
    \ und/oder Stauraum n\xF6tig, sollte genau abgewogen werden, welches Segment den\
    \ Umweltanspr\xFCchen und der Vorbildfunktion der Institution entspricht."
  B24: "Auch wenn meistens bis zu vier Personen in dem Auto fahren, sollte aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Bereits in diesem\
    \ Fahrzeugsegment gibt es viele Modelle mit ausreichend Platz f\xFCr gro\xDFe\
    \ Erwachsene auf der R\xFCckbank. Ist mehr Komfort und/oder Stauraum n\xF6tig,\
    \ sollte genau abgewogen werden, welches Segment den Umweltanspr\xFCchen und der\
    \ Vorbildfunktion der Institution entspricht."
  B25: "Wenn selten alle f\xFCnf Sitzpl\xE4tze ben\xF6tigt werden, sollte aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Bereits in diesem\
    \ Fahrzeugsegment gibt es viele Modelle mit ausreichend Platz f\xFCr gro\xDFe\
    \ Erwachsene auf der R\xFCckbank. Ist mehr Komfort und/oder Stauraum n\xF6tig,\
    \ sollte genau abgewogen werden, welches Segment den Umweltanspr\xFCchen und der\
    \ Vorbildfunktion der Institution entspricht."
  B26: "Werden oft alle f\xFCnf Sitzpl\xE4tze ben\xF6tigt, ist ein Fahrzeug der Mittelklasse\
    \ zu empfehlen."
  B27: "Im betrachteten Beschaffungsfall sollte bei bis zu vier Personen aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Bereits in diesem\
    \ Fahrzeugsegment gibt es viele Modelle mit ausreichend Platz f\xFCr gro\xDFe\
    \ Erwachsene auf der R\xFCckbank. Werden oft f\xFCnf Sitzpl\xE4tze oder mehr Komfort/Stauraum\
    \ ben\xF6tigt, ist ein Fahrzeug der Mittelklasse zu empfehlen.\n\nF\xFCr die Ausnahmef\xE4\
    lle, in denen \xFCber f\xFCnf Sitzpl\xE4tze ben\xF6tigt werden, kann ein Hochdachkombi\
    \ (falls verf\xFCgbar) aus dem Fuhrpark verwendet oder sonst gemietet werden."
  B28: "Im betrachteten Beschaffungsfall sollte bei bis zu vier Personen aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Bereits in diesem\
    \ Fahrzeugsegment gibt es viele Modelle mit ausreichend Platz f\xFCr gro\xDFe\
    \ Erwachsene auf der R\xFCckbank. Werden oft f\xFCnf Sitzpl\xE4tze oder mehr Komfort/Stauraum\
    \ ben\xF6tigt, ist ein Fahrzeug der Mittelklasse zu empfehlen.\n\nF\xFCr die Ausnahmef\xE4\
    lle, in denen \xFCber f\xFCnf Sitzpl\xE4tze ben\xF6tigt werden, kann ein Hochdachkombi\
    \ gemietet werden."
  B29: "Wenn nur selten \xFCber f\xFCnf Sitzpl\xE4tze ben\xF6tigt werden, kann f\xFC\
    r diese Ausnahmef\xE4lle ein Hochdachkombi oder Kleinbus (falls verf\xFCgbar)\
    \ aus dem Fuhrpark verwendet oder sonst gemietet werden. Bei regelm\xE4\xDFigen\
    \ aufw\xE4ndigen Transportanforderungen ist allerdings ohnehin ein Van oder ein\
    \ Fahrzeug der Rubrik Utilities (Hochdachkombis, Kleinbusse und Pick-ups, die\
    \ als Pkw zugelassen sind) notwendig. Bei der Wahl der Fahrzeugart ist also abzuw\xE4\
    gen, ob der Personentransport (-> Hochdachkombi, Kleinbus) oder der Transport\
    \ von Gegenst\xE4nden (-> Van, Hochdachkombi, Pick-up) \xFCberwiegt."
  B3: Empfehlung zur Antriebsart
  B30: "Wenn nur selten \xFCber f\xFCnf Sitzpl\xE4tze ben\xF6tigt werden, kann f\xFC\
    r diese Ausnahmef\xE4lle ein Hochdachkombi oder Kleinbus gemietet werden. Bei\
    \ regelm\xE4\xDFigen aufw\xE4ndigen Transportanforderungen ist allerdings ohnehin\
    \ ein Van oder ein Fahrzeug der Rubrik Utilities (Hochdachkombis, Kleinbusse und\
    \ Pick-ups, die als Pkw zugelassen sind) notwendig. Bei der Wahl der Fahrzeugart\
    \ ist also abzuw\xE4gen, ob der Personentransport (-> Hochdachkombi, Kleinbus)\
    \ oder der Transport von Gegenst\xE4nden (-> Van, Hochdachkombi, Pick-up) \xFC\
    berwiegt."
  B31: "Werden oft mind. sechs Sitzpl\xE4tze ben\xF6tigt, sollte ein Hochdachkombi\
    \ beschafft werden. Diese Fahrzeugart hat unter den 7-Sitzern in der Regel das\
    \ beste Preis-Leistungs-Verh\xE4ltnis und f\xE4hrt sparsamer als z.B. ein SUV."
  B32: "Im betrachteten Beschaffungsfall sollte bei bis zu vier Personen aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Bereits in diesem\
    \ Fahrzeugsegment gibt es viele Modelle mit ausreichend Platz f\xFCr gro\xDFe\
    \ Erwachsene auf der R\xFCckbank. Werden oft f\xFCnf Sitzpl\xE4tze oder mehr Komfort/Stauraum\
    \ ben\xF6tigt, ist ein Fahrzeug der Mittelklasse zu empfehlen.\n\nF\xFCr die Ausnahmef\xE4\
    lle, in denen \xFCber sieben Sitzpl\xE4tze ben\xF6tigt werden, kann ein Kleinbus\
    \ (falls verf\xFCgbar) aus dem Fuhrpark verwendet oder sonst gemietet werden."
  B33: "Im betrachteten Beschaffungsfall sollte bei bis zu vier Personen aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Bereits in diesem\
    \ Fahrzeugsegment gibt es viele Modelle mit ausreichend Platz f\xFCr gro\xDFe\
