    \ beschaffen\". Sollte der Einsatzzweck f\xFCr alle zu beschaffenden Pkw gleich\
    \ sein, k\xF6nnen die resultierenden Empfehlungen f\xFCr die komplette Ausschreibung\
    \ \xFCbernommen werden. Bei sich deutlich unterscheidenden Einsatzzwecken sollten\
    \ die Abfragen pro Einsatzzweck bearbeitet werden."
  B8: "Der folgende Teil besch\xE4ftigt sich mit den Fragen, wie der Mobilit\xE4tsbedarf\
    \ gedeckt werden kann und ob alle Pkw-Beschaffungen tats\xE4chlich notwendig sind.\
    \ Solche Vor\xFCberlegungen bez\xFCglich der Bedarfsermittlung sind z.B. im Land\
    \ Berlin verpflichtend zu dokumentieren.\n\nDie Fragen sollten jeweils f\xFCr\
    \ einen Standort bzw. f\xFCr Zusammenschl\xFCsse von Standorten/Institutionen,\
    \ die Fahrzeuge untereinander austauschen/gemeinsam nutzen, beantwortet werden."
