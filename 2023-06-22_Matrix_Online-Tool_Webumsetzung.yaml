  E_F1: "Bei regelm\xE4\xDFigen aufw\xE4ndigen Transportanforderungen ist ein Van\
    \ oder ein Fahrzeug der Rubrik Utilities (Hochdachkombis, Kleinbusse und Pick-ups,\
    \ die als Pkw zugelassen sind) notwendig."
  E_F10: "Werden oft alle f\xFCnf Sitzpl\xE4tze ben\xF6tigt, ist ein Fahrzeug der\
    \ Mittelklasse zu empfehlen."
  E_F11: "Im betrachteten Beschaffungsfall sollte bei bis zu vier Personen aus Umweltsicht\
    \ bevorzugt ein Fahrzeug der Kompaktklasse beschafft werden. Bereits in diesem\
    \ Fahrzeugsegment gibt es viele Modelle mit ausreichend Platz f\xFCr gro\xDFe\
    \ Erwachsene auf der R\xFCckbank. Werden oft f\xFCnf Sitzpl\xE4tze oder mehr Komfort/Stauraum\
    \ ben\xF6tigt, ist ein Fahrzeug der Mittelklasse zu empfehlen.\n\nF\xFCr die Ausnahmef\xE4\
    lle, in denen \xFCber f\xFCnf Sitzpl\xE4tze ben\xF6tigt werden, kann ein Hochdachkombi\
    \ (falls verf\xFCgbar) aus dem Fuhrpark verwendet oder sonst gemietet werden."
