  E_A1: "Wenn weder am Arbeitsplatz (bzw. im umliegenden \xF6ffentlichen Raum) noch\
    \ am Wohnort der Nutzenden eine f\xFCr mehrere Stunden nutzbare Ladem\xF6glichkeit\
    \ besteht, ist die Beschaffung eines E-Autos nicht sinnvoll. In diesem Fall sollte\
    \ ein m\xF6glichst sparsamer Verbrenner beschafft werden. \n\nDer Auf- und Ausbau\
    \ von Ladeinfrastruktur ist jedoch unbedingt zu empfehlen, um in Zukunft E-Autos\
    \ beschaffen zu k\xF6nnen."
  E_A10: "Bei vielen langen Strecken, auf denen keine Ladem\xF6glichkeit besteht,\
    \ ist die Beschaffung eines E-Autos nicht sinnvoll. In diesem Fall sollte ein\
    \ m\xF6glichst sparsamer Verbrenner beschafft werden."
  E_A11: "Bei vielen langen Strecken, auf denen keine Ladem\xF6glichkeit besteht,\
    \ ist die Beschaffung eines E-Autos nicht sinnvoll. In diesem Fall sollte ein\
    \ m\xF6glichst sparsamer Verbrenner beschafft werden. \n\nDas Fahrprofil mit regelm\xE4\
    \xDFigen l\xE4ngeren Fahrtunterbrechungen eignet sich an sich allerdings f\xFC\
    r E-Autos. Der weitere Ausbau der \xF6ffentlichen Ladeinfrastruktur oder die Wahl\
    \ von Alternativrouten mit verf\xFCgbaren Lades\xE4ulen kann also (in Zukunft)\
    \ eine E-Auto-Beschaffung durchaus erm\xF6glichen. "
  E_A2: "Ein E-Auto (BEV - rein batteriebetrieben) ist bevorzugt zu beschaffen, da\
    \ Reichweiten bis 300 km mit den heute \xFCblichen E-Pkw in der Regel erzielbar\
    \ sind, sodass das Laden \xFCber Nacht ausreicht. \n\nF\xFCr einzelne Tagesstrecken\
    \ \xFCber 300 km sollte idealerweise die Bahn oder der Fernbus genutzt werden.\
    \ Bei schlechter Anbindung an den \xF6ffentlichen Verkehr oder mit viel Gep\xE4\
    ck/Transportgut kann das E-Auto auch auf l\xE4ngeren Tagesstrecken zum Einsatz\
    \ kommen, sofern unterwegs oder am Zielort (Schnell-)Ladem\xF6glichkeiten genutzt\
    \ werden k\xF6nnen. Besteht die M\xF6glichkeit zum Laden nicht, kann in diesen\
    \ Ausnahmef\xE4llen (falls vef\xFCgbar) ein anderes Fahrzeug mit entsprechender\
    \ Reichweite aus dem Fuhrpark oder sonst ein Mietwagen genutzt werden."
  E_A3: "Ein E-Auto (BEV - rein batteriebetrieben) ist bevorzugt zu beschaffen, da\
    \ Reichweiten bis 300 km mit den heute \xFCblichen E-Pkw in der Regel erzielbar\
    \ sind, sodass das Laden \xFCber Nacht ausreicht. \n\nF\xFCr einzelne Tagesstrecken\
    \ \xFCber 300 km sollte idealerweise die Bahn oder der Fernbus genutzt werden.\
    \ Bei schlechter Anbindung an den \xF6ffentlichen Verkehr oder mit viel Gep\xE4\
    ck/Transportgut kann das E-Auto auch auf l\xE4ngeren Tagesstrecken zum Einsatz\
    \ kommen, sofern unterwegs oder am Zielort (Schnell-)Ladem\xF6glichkeiten genutzt\
    \ werden k\xF6nnen. Besteht die M\xF6glichkeit zum Laden nicht, kann in diesen\
    \ Ausnahmef\xE4llen ein Mietwagen genutzt werden."
  E_A4: "Ein E-Auto (BEV - rein batteriebetrieben) ist bevorzugt zu beschaffen, da\
    \ Reichweiten bis 300 km mit den heute \xFCblichen E-Pkw in der Regel erzielbar\
    \ sind, sodass das Laden \xFCber Nacht ausreicht. \n\nWenn h\xE4ufiger auch mal\
    \ Tagesstrecken \xFCber 300 km zur\xFCckgelegt werden sollen und unterwegs oder\
    \ am Zielort (Schnell-) Ladem\xF6glichkeiten genutzt werden k\xF6nnen, kann das\
    \ E-Auto auch auf diesen Strecken zum Einsatz kommen. Besteht die M\xF6glichkeit\
    \ zum Laden nicht, sollte gepr\xFCft werden, ob f\xFCr die Einsatztage mit l\xE4\
    ngeren Strecken regelm\xE4\xDFig ein anderes Fahrzeug mit entsprechender Reichweite\
    \ aus dem Fuhrpark genutzt werden kann. Dieses Fahrzeug kann auch ein E-Auto mit\
    \ gr\xF6\xDFerer Batterie sein, da in h\xF6heren Preissegmenten reale 400 km Reichweite\
    \ g\xE4ngig sind. Zudem ist zu pr\xFCfen, ob die Tagesstrecken \xFCber 300 km\
    \ tats\xE4chlich zum Gro\xDFteil mit dem Pkw zur\xFCckgelegt werden m\xFCssen\
    \ (aufgrund schlechter Anbindung an den \xF6ffentlichen Verkehr oder viel Gep\xE4\
    ck/Transportgut) oder ob mit Bahn oder Fernbus gereist werden kann."
  E_A5: "Ein E-Auto (BEV - rein batteriebetrieben) ist bevorzugt zu beschaffen, da\
    \ Reichweiten bis 300 km mit den heute \xFCblichen E-Pkw in der Regel erzielbar\
    \ sind, sodass das Laden \xFCber Nacht ausreicht. \n\nWenn h\xE4ufiger auch mal\
    \ Tagesstrecken \xFCber 300 km zur\xFCckgelegt werden sollen und unterwegs oder\
    \ am Zielort (Schnell-) Ladem\xF6glichkeiten genutzt werden k\xF6nnen, kann das\
    \ E-Auto auch auf diesen Strecken zum Einsatz kommen. Zudem ist zu pr\xFCfen,\
    \ ob die Tagesstrecken \xFCber 300 km tats\xE4chlich zum Gro\xDFteil mit dem Pkw\
    \ zur\xFCckgelegt werden m\xFCssen (aufgrund schlechter Anbindung an den \xF6\
    ffentlichen Verkehr oder viel Gep\xE4ck/Transportgut) oder ob mit Bahn oder Fernbus\
    \ gereist werden kann.\n\nIst dies nicht der Fall und besteht keine M\xF6glichkeit\
    \ zum Laden w\xE4hrend l\xE4ngerer Strecken, kann die Beschaffung eines Plug-in-Hybrids\
    \ (PHEV) sinnvoll sein. In diesem Fall sollte jedoch darauf geachtet werden, dass\
    \ bei den k\xFCrzeren Strecken, die im Regelfall gefahren werden, ein elektrischer\
    \ Fahranteil von \xFCber 70 % erzielt wird. Dazu muss ein regelm\xE4\xDFiges Laden\
    \ gew\xE4hrleistet sein. Zudem sind PHEVs eher in gr\xF6\xDFeren Fahrzeugsegmenten\
    \ verf\xFCgbar. Je nach Anwendungsfall kann ein kleiner, sparsamer Verbrenner\
    \ auch aus Umweltsicht vorteilhaft gg\xFC. einem PHEV sein. "
  E_A6: "Inkonsistente Eingabe: Die Aussage zur H\xE4ufigkeit l\xE4ngerer Strecken\
    \ passt nicht mit der angegeben Streckenl\xE4nge eines repr\xE4sentativen Tages\
    \ zusammen. Bitte passen Sie die Streckenl\xE4nge so an, dass sie den Fahrten\
    \ im Regelfall entspricht."
  E_A7: "Erlaubt die Terminplanung Fahrtunterbrechungen von mind. 20-40 min an Standorten\
    \ mit (Schnell-)Ladem\xF6glichkeiten, ist ein E-Auto (BEV - rein batteriebetrieben)\
    \ trotz h\xE4ufiger l\xE4ngerer Strecken bevorzugt zu beschaffen. "
  E_A8: "Ein E-Auto (BEV - rein batteriebetrieben) mit gro\xDFer Reichweite ist ggf.\
    \ geeignet. In h\xF6heren Preissegmenten ist eine Reichweite von 300 km g\xE4\
    ngig. Es sollte jedoch beachtet werden, dass dem Umweltvorteil eines BEV in der\
    \ Nutzung die Herstellungsemissionen einer gro\xDFen Batterie gegen\xFCberstehen.\
    \ Zudem sind gro\xDFe Batterien vor allem in gr\xF6\xDFeren Fahrzeugen verbaut.\
    \ Ein kleinerer, m\xF6glichst sparsamer Verbrenner kann in diesem Anwendungsfall\
    \ aus Umweltsicht (und aus Kostensicht ohnehin) also durchaus vorteilhaft sein."
  E_A9: "Erlaubt die Terminplanung auf langen Strecken keine bzw. nur sehr kurze Fahrtunterbrechungen\
    \ unter 30 min, ist die Beschaffung eines E-Autos nicht sinnvoll. In diesem Fall\
    \ sollte ein m\xF6glichst sparsamer Verbrenner beschafft werden."
