    F_S1=A_S2, F_F1=A_JN2), E_A5, AND(F_R1<=A_R1, F_S1=A_S3), E_A6, AND(F_R1>A_R1,
    F_S1=A_S1), E_A6, AND(F_R1>A_R1, F_SZ1=A_SV1), E_A9, AND(F_R1>A_R1, F_S1=A_S2,
