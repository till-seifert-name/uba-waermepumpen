  E1: "Alter Code/ \xC4nderung auf Website"
  E10: "Eingabek\xE4sten: Rahmen auch schon vor der Eingabe/Auswahl in dunkelgrau\
    \ (wie in Figma) und Sternchen weglassen"
  E100: "Letzte Unteraufz\xE4hlung unter \"(Panorama-)Glasdach\" austauschen mit \"\
    Negativer Einfluss auf die Fahrzeugisolation/Aufheizung und damit auf den Heizbedarf\
    \ und die K\xFChlleistung\""
  E101: "PDF f\xFCr Downloadversion (sowohl auf Startseite unter Downloads als auch\
    \ als Druckversion des Pop-ups) ersetzen (siehe Link zu PDF im Kommentar)"
  E102: "Anpassungen rot markiert (und Zelle gelb gef\xE4rbt) in Spalte B; Hinweise\
    \ dazu in Spalte C. Zum Teil Kommentare f\xFCr Hyperlink \xFCber dem Wort \"Modelle\"\
    \ (ist immer der gleiche Link - Hinweis in Spalte C, wenn Link verwendet werden\
    \ soll). Bei der \xDCbernahme bitte wieder die Zeilenumbr\xFCche beachten"
  E103: "\xC4nderungen in Infoboxen wie per Mail besprochen \xFCbernehmen -> Abschnittsweise\
    \ die \xC4nderungen annehmen und dann \xFCbernehmen. Z.T. auch neue Verlinkungen\
    \ zu anderen Infoboxen (in Kommentaren als NEU markiert). Abschnitts\xFCberschriften\
    \ haben sich zum Teil ge\xE4ndert -> f\xFCr \"Hintergrundinformationen\" und Infoboxen\
    \ \xFCbernehmen, aber in der \xDCbersichtsgrafik so lassen (ist sonst teilweise\
    \ zu lang f\xFCr die kleinen Boxen in der Grafik). Link zur Word-Datei im Kommentar"
  E104: Code aus Mail einbinden
  E105: "Neuen Absatz zur THG-Quote (siehe Word) einf\xFCgen. Den untersten Absatz\
    \ auf der linken Seite (Hinweis zum eFleet Guide) dann ganz unten auf der rechten\
    \ Seite platzieren, damit die linke und rechte Seite von der H\xF6he her in etwa\
    \ ausgeglichen sind. Noch was zum ersten Absatz: \"(siehe hier f\xFCr Vorschl\xE4\
    ge zu Umweltanforderungen ).\" -> Ein Leerzeichen zu viel hinter \"Umweltanforderungen\""
  E106: "Die H\xE4kchen und Plus-Zeichen in den unteren beiden Boxen werden gerade\
    \ nicht richtig dargestellt (\"check\" und \"add\" statt Symbole)"
  E107: "\"(WLTP)\" in Tabelle hinter \"Partikelzahl (PN)\", \"Energieverbrauch\"\
    \ -> Also wie in den beiden Zeilen dar\xFCber bei CO2 und NOx."
  E108: "Bei \"Umgang mit Sonderausstattung\" die Reihenfolge der Aufz\xE4hlungspunkte\
    \ \xE4ndern -> \"Kohlefaser (Carbon)\" als drittes ganz unten"
  E109: "PDF f\xFCr Downloadversion (sowohl auf Startseite unter Downloads als auch\
    \ als Druckversion des Pop-ups) ersetzen (siehe Link zu PDF im Kommentar)"
  E11: "Fragebutton neben \"Wie viele Fahrzeuge aus einem vorhandenen Fuhrpark werden\
    \ durch diese Beschaffung ersetzt?\" (siehe Figma, Text f\xFCr Hilfebox siehe\
    \ Link in Kommentar)"
  E110: LZK-Dateien austauschen (siehe Mail)
  E111: "Link \xFCber \"Berlin\" \xF6ffnet nicht in neuem Tab"
  E112: "Neuer Abschnitt zu Ladeinfrastruktur in neuer Extra-Box (siehe Word). Abschnitt\
    \ zum eFleet Guide daf\xFCr wieder auf die linke Seite ganz unten (sorry f\xFC\
    r das Hin und Her... - dass man die Ladeinfrastruktur nochmal hier bringen k\xF6\
    nnte, ist mir erst heute bei der Abschlussveranstaltung aufgefallen, als es da\
    \ nochmal explizit drum ging. Ausschlie\xDFlich in den Hilfeboxen bei den Empfehlungen\
    \ ist es ggf. zu versteckt)"
  E113: "Irgendwie sind die \xDCberschriften im Akkordeonmen\xFC verrutscht. Bitte\
    \ wieder auf die gleiche H\xF6he wie die Texte platzieren"
  E114: "Susanne hatte gerade nochmal kurz dr\xFCbergeguckt und gefragt, ob du das\
    \ gr\xFCne Blatt auf der rechten Seite komplett lassen k\xF6nntest, wenn die Bildschirmbreite\
    \ das zul\xE4sst. Ist das ohne gro\xDFen Aufwand m\xF6glich? Falls nicht, kann's\
    \ aber auch so bleiben, wie es ist :-)"
  E115: "Reichweiten-Grenze f\xFCr BEV von 150 auf 300 km ge\xE4ndert (nach Recherche\
    \ mithilfe der ADAC-Datenbank durch Felix)"
  E116: "Reichweiten-Grenze f\xFCr BEV von 150 auf 300 km ge\xE4ndert + 400 km bei\
    \ gr\xF6\xDFerer Batterie/h\xF6herem Preissegment"
  E117: "Toolversion Stand erg\xE4nzen und ifeu-Logo daf\xFCr etwas nach oben r\xFC\
    cken + Fu\xDFzeile nach unten verl\xE4ngern (siehe PPT in Mail)"
  E12: "PKW (\xFCber der Auswahl f\xFCr Pooling etc.)"
  E13: "Farbige Buttons neben Auswahloptionen hinzuf\xFCgen (siehe Figma), die dann\
    \ die entsprechenden Infoboxen \xF6ffnen"
  E14: "Auswahlfelder verbreitern, sodass \"H\xE4ufigkeit der Nutzung\" ganz zu sehen\
    \ ist -> Schrift ggf. auch ein bisschen kleiner; Erste Auswahlfelder etwas von\
    \ \"Eine Analyse der bisherigen Nutzung des Fuhrparks kann bei der Beantwortung\
    \ der Frage helfen.\" abr\xFCcken/etwas tiefer (siehe Figma)"
  E15: "Unter 3. -> Hinweis auf Download + Download-Button (siehe Figma) -> im Gegensatz\
    \ zu Figma soll im Button allerdings stehen \"Download Vor\xFCberlegungen\""
  E16: "Text in zwei Zeilen anordnen, damit der Text nicht \xFCber die gesamte Seite\
    \ geht"
  E17: "Men\xFC nur als Box auf der rechten Seite ausklappen (siehe Figma)"
  E18: "ifeu-Logo nach rechts r\xFCcken (sieht bei mir verrutscht aus und ist unter\
    \ den anderen drei Logos gelandet)"
  E19: 'Link auf Logos setzen -> DBU: https://www.dbu.de/; Berlin: https://www.berlin.de/sen/uvk/;
    Brandenburg: https://mluk.brandenburg.de/mluk/de/'
  E2: 'Formeln: Bezug auf Zellen'
  E20: "Nicht als Kasten mit Schatten au\xDFenrum, sondern vom Design her wie in Figma"
  E21: "Impressum und Datenschutz: Overlays mit Infos erg\xE4nzen"
  E22: "Tool nicht \xFCber die ganze Breite gehen lassen, sondern so wie in Figma\
    \ + etwas mehr Platz am Rand lassen (wie in Figma)"
  E23: "Kopfzeile: Auto-Icon ist wie in Figma ganz ohne Schatten. Bei den Vor\xFC\
    berlegungen hattest du die Version mit ein bisschen Schatten (weniger als in der\
    \ \xDCbersichtsgrafik, aber mehr als jetzt gerade in Figma in der Kopfzeile) genommen.\
    \ Das finde ich sogar besser, also gerne auch hier die Version mit ein bisschen\
    \ Schatten"
  E24: "Etwas Abstand zwischen den Aufz\xE4hlungspunkten lassen (siehe Figma)"
  E25: "Die ersten beiden Fragen haben schon einen Eintrag, obwohl ich ein neues privates\
    \ Fenster ge\xF6ffnet habe "
  E26: "Die Ja/Nein-Buttons sehen schon f\xFCr \"Ja\" vorausgew\xE4hlt aus, aber werden\
    \ anscheinend erst gezogen, nachdem man nochmal draufklickt/die Auswahl wechselt.\
    \ Hier bitte im ersten Schritt keine Seite einf\xE4rben und mit H\xE4kchen versehen"
  E27: 'Kopfzeile: ANGABEN statt FAHRZEUGSEGMENT'
  E28: "Infokasten zu Umweltanforderungen: Bindestrich in \"Umwelt-anforderungen\"\
    \ rausnehmen -> also erster Satz \"Neben der Wahl der Antriebsart und des Fahrzeugsegments\
    \ k\xF6nnen Umweltanforderungen in der Ausschreibung einen Beitrag zur umweltvertr\xE4\
    glichen Pkw-Beschaffung leisten.\""
  E29: "Bei mir muss man gerade scrollen, um alles zu sehen. In Figma ist das nicht\
    \ n\xF6tig, aber da ist die Schrift dann auch noch kleiner, oder? Kleiner w\xFC\
    rde ich mit der Schrift lieber nicht werden. Falls sich das Scrollen nicht vermeiden\
    \ l\xE4sst, gerne die Kopfzeile mit \"EMPFEHLUNGEN 4/4\" etc. fixieren"
  E3: "Bei Aufz\xE4hlung einzelne W\xF6rter fettgedruckt wie in Figma"
  E30: "Grafik Alternativen zum Pkw-Kauf -> Anordnung: Einordnung oben/unten in Grafik\
    \ tauschen, also Fahrrad + \xD6PNV oben, die Pkw-bezogenen Kreise (Pooling, Sharing,\
    \ Mieten) unten; Kreisgr\xF6\xDFe abh\xE4ngig machen von x-Achse, also links kleine\
    \ Kreise, rechts die gr\xF6\xDFten Kreise; Grafik schon anzeigen, sobald die erste\
    \ Auswahl getroffen wird und dann nach und nach Kreise erg\xE4nzen, sobald jeweilige\
    \ Auswahl getroffen"
  E31: "Grafik Alternativen zum Pkw-Kauf -> Text + Hovern: y-Achsen-Beschriftung:\
    \ \"PKW\" ersetzen mit \"PKW-KAUF\"; x-Achse -> REGELM\xC4SSIG hat ein S zu viel;\
    \ Beschriftung aus Legende beim Hovern \xFCber Kreise anzeigen (siehe Figma)"
  E32: "Wenn man auf die offizielle Website klickt, steht oben als Kurztitel im Tab\
    \ zurzeit \"DBU Online-Tool\". Kannst du das \xE4ndern zu \"Pkw-Beschaffung\"?"
  E33: "Blassere Boxen f\xFCr Car-Pooling etc. (entsprechend auch bei \xD6ffentl.\
    \ + Fahrrad) noch etwas blasser einf\xE4rben, damit sie sich noch besser abheben"
  E34: "Suchfunktion erg\xE4nzen (siehe Figma)"
  E35: "Bildchen neben Infoboxen passen nicht ganz in den Rahmen, wenn der Bildschirm\
    \ sehr breit ist -> Problem l\xF6st sich ggf. ohnehin, wenn die Bildschirmbreite\
    \ nicht mehr ganz ausgenutzt wird (siehe Changelog Zeile 22)"
  E36: "Cool, dass du die Download-Funktion schon eingebaut hast. Die war an sich\
    \ von Susanne erstmal nur vorgemerkt f\xFCr einen sp\xE4teren Zeitpunkt, aber\
    \ scheint ja gut zu funktionieren. Eine Sache ist mir dabei jedoch aufgefallen:\
    \ Die Infoboxen werden in der Druckansicht immer doppelt ausgegeben, also immer\
    \ zwei Seiten mit dem gleichen Inhalt. Falls sich das einfach l\xF6sen l\xE4sst,\
    \ gerne - ansonsten das Icon einfach erstmal weglassen"
  E37: Das Symbol zum Teilen war auch nur von Susanne vorgemerkt - das kannst du erstmal
    einfach rauslassen
  E38: "Links zu externen Websites in neuem Tab \xF6ffnen"
  E39: 'In erstem Absatz und in Abb.-Beschriftung: CO2 -> 2 tiefgestellt;  in Abb.-Beschriftung:
    (UBA 2021) verlinken (siehe Word)'
  E4: "Verkn\xFCpfung der Felder in der \xDCbersichtsgrafik mit den Infoboxen (gleiche\
    \ Infoboxen wie im Teil \"Hintergrundinformationen\")"
  E40: "Grafik ist bei breitem Bildschirm sehr gro\xDF - so anpassen, dass die Schriftgr\xF6\
    \xDFe in der Grafik in etwa so gro\xDF ist wie der restliche Text; Zoomfunktion\
    \ f\xFCr Grafik erm\xF6glichen (siehe Figma)"
  E41: "Die Unter\xFCberschrift \"Jobrad\" fettgedruckt; den unteren Teil zum Jobrad\
    \ in eine extra Box in dieser Infobox mit dem Symbol f\xFCr rechtliche Hinweise\
    \ (also wie das Beispiel in Figma in der Antriebsart-Box)"
  E42: "\"Neubeschaffung\" nicht als Link, aber daf\xFCr fettgedruckt. Daf\xFCr \"\
    geleast/gekauft\" im oberen Absatz als Link zur \"Leasing/Kauf eines Pkw\"-Infobox\
    \ + \"Koordinierung des bestehenden Fuhrparks\" als Link zur \"Car-Pooling\"-Infobox\
    \ (aber dann nicht mehr fettgedruckt)"
  E43: "Kann man es so einstellen, dass bei der sich \xF6ffnenden Druck-Ansicht direkt\
    \ bei Ziel \"Als PDF speichern\" und nicht irgendein Drucker ausgew\xE4hlt wird?"
  E44: "Bei der Druckansicht fehlt bei den gro\xDFen Infoboxen (Antriebsart, Fahrzeugsegment,\
    \ Ausstattung) der untere Teil, der nicht mehr auf eine DIN A4-Seite passt (kl\xE4\
    rt sich ggf. zusammen mit dem Task in Zeile 36)"
  E45: Den letzten Absatz "Neben den Infoboxen auf dieser Website..." unter die Box
    "Rechtlicher Hinweis"
  E46: "Leerzeichen zwischen \"Fahrzeuggr\xF6\xDFe\" und \"orientiert\" (\xFCber der\
    \ Aufz\xE4hlung)"
  E47: "\"Kontakt\" erg\xE4nzen -> siehe Figma"
  E48: "Dateien f\xFCr LZK-Rechner zum Download bereitstellen (siehe Mail)"
  E49: "Umweltanforderungen: Bei der schnellen L\xF6sung (Erzeugen einer PDF aus Figma)\
    \ gibt es drei Probleme (da ich leider nur einen View-only-Zugang habe und nichts\
    \ direkt in Figma anpassen kann): 1. Die Beschriftung der ersten Kategorie ist\
    \ in Figma verrutscht (\"CO2-Emissionen (WLTP)\" klebt unter der Partikelzahl).\
    \ 2. Das x oben rechts und der Download-Pfeil sind hinf\xE4llig. 3. Die Fu\xDF\
    note fehlt in Figma. K\xF6nntest du die Umweltanforderungen also doch selber zusammenbauen?\
    \ Falls das nicht bis heute Abend klappt, schicke ich dir die Ursprungsdatei aus\
    \ Word als PDF, die du zum Download bereitstellen kannst (auch bei Empfehlungen\
    \ Seite 4 beim entsprechenden Verweis auf die Umweltanforderungen)"
  E5: "Kopfzeile: Zur\xFCcksetzen-Funktion neben \"ANGABEN\" wie in Figma"
  E50: "Button \"Download individuelle Empfehlungen\" \xE4ndern zu \"Download Empfehlungen\""
  E51: "Die Grafik fehlt hier noch - f\xFCr eine schnelle L\xF6sung hier einfach die\
    \ Grafik aus Figma als Bild einsetzen (sp\xE4ter dann nachbauen?)"
  E52: "CO2 -> 2 tiefgestellt (an 4 Stellen); Link nur \xFCber das erste Mal \"SaubFahrzeugBeschG\"\
    : https://bmdv.bund.de/SharedDocs/DE/Artikel/G/clean-vehicles-directive.html;\
    \ \"Umweltanforderungen\" im unteren Absatz mit PDF verlinken (wie bei Downloads)"
  E53: "Bei \"1.2. Lades\xE4ulen\" zwei Hilfebuttons einbauen (siehe Link in Kommentar);\
    \ unter \"1.2. Lades\xE4ulen\" Text \xFCber der ersten Frage erg\xE4nzen: \"Neben\
    \ der Reichweite der Batterie ist die Verf\xFCgbarkeit von Ladeinfrastruktur entscheidend\
    \ daf\xFCr, ob ein E-Auto geeignet ist.\""
  E54: "Insgesamt 4 Hilfebuttons erg\xE4nzen (Text siehe Link in Kommentar)"
  E55: "In der Kopfzeile (alle Seiten au\xDFer die Startseite) beim Hovern \xFCber\
    \ den Tool-Titel oben links eine Zeige-Hand erscheinen lassen (wie sonst auch\
    \ bei klickbaren Elementen)"
  E56: 'Grafik etwas kleiner '
  E57: "Icon f\xFCr die rechtlichen Hinweise als \xA7 (siehe Kommentar dazu in Figma-Kommentarwechsel)"
  E58: Siehe Mail
  E59: Tooltip "Drucken" ersetzen mit "Herunterladen"
  E6: "Kopfzeile wie in Figma erg\xE4nzen: DOKUMENTATION, Download-Funktion, Wechselbutton\
    \ zwischen Dokumentation und \xDCbersichtsgrafik"
  E60: "Beim Testen des Tools ist mir aufgefallen, dass es beim Hin- und Herspringen\
    \ zwischen den verschiedenen Tooleinstiegen etwas l\xE4stig ist, dass man immer\
    \ wieder auf der ersten Seite eines jeden Tooleinstiegs landet und sich dann wieder\
    \ bis zur letzten Seite durchklicken muss, wenn man dort hinwill. Daher die zwei\
    \ Fragen: Sollte sich das Tool die jeweils zuletzt besuchte Seite eines Tooleinstiegs\
    \ merken und dann direkt dahin springen? Und/oder sollten wir doch wieder auf\
    \ die Punkte statt des Fortschrittbalkens in der Navigation gehen und dann die\
    \ Punkte anklickbar machen, damit man schneller auf die letzte Seite kommt?"
  E61: "Statt \"Notwendigkeit der Beschaffung\" -> \"Notwendigkeit der Beschaffung\
    \ pr\xFCfen\u201C"
  E62: "Kann ein m\xF6glichst umweltvertr\xE4gliches Fahrzeug beschafft werden? "
  E63: "Als ersten Absatz neu einf\xFCgen: \"Von der \xF6ffentlichen Hand werden in\
    \ Deutschland pro Jahr \xFCber 40.000 Fahrzeuge (ohne \xD6PNV und Eigenbetriebe\
    \ wie M\xFCllentsorgung) angeschafft. Dieses Finanz- und Nachfragevolumen begr\xFC\
    ndet eine besondere Verantwortung der \xF6ffentlichen Hand zur umweltvertr\xE4\
    glichen Beschaffung in diesem Bereich.\" -> Danach den jetzigen ersten Satz streichen\
    \ (Es gibt viele M\xF6glichkeiten, die Beschaffung umweltvertr\xE4glicher zu gestalten.)\
    \ und den verbleibenden Satz (Mithilfe dieses Tools k\xF6nnen Sie sich umfassend\
    \ zu Themen der umweltvertr\xE4glichen Beschaffung im Mobilit\xE4tsbereich informieren.)\
    \ an den Anfang des n\xE4chsten Absatzes packen (also in den Absatz \"Der Fokus\
    \ des Tools liegt...\" eingliedern)"
  E64: "Die \xDCbersichtsgrafik zeigt, an welchen Punkten im Beschaffungsprozess dieses\
    \ Tool mit welchen Mitteln ansetzt. "
  E65: '"Angebotswertung" statt "Angebotsbewertung" in Kasten; "Lebenszykluskosten-Rechner"
    statt "Lebenszykluskosten-Tool"'
  E66: 'In Titel "Downloads: Umweltanforderungen und Lebenszykluskosten-Tool " ->
    "Tool" durch "Rechner" ersetzen'
  E67: "Dateinamen korrigieren: \"LZK\" statt \"LKZ\" (beim Herunterladen hei\xDF\
    en die Dateien dann aber richtig); Punkt entfernen nach \"Dokumentation des Rechners,\
    \ die der Aussschreibung beigef\xFCgt werden kann\""
  E68: "Dickgedruckte W\xF6rter \xE4ndern: Statt \"Datei\" -> \"Umweltanforderungen\"\
    ; statt \"Tool\" -> \"Lebenszykluskosten-Rechner\"; nach den dickgedruckten W\xF6\
    rtern dann ein Zeilenumbruch (siehe Figma)"
  E69: "\"Den rechtlichen Rahmen f\xFCr die \xF6ffentliche Pkw-Beschaffung...\" ->\
    \ \"\xF6ffentliche\" erg\xE4nzen"
  E7: "Auswahl der Ansicht Dokumentation/\xDCbersichtsgrafik \xFCber Wechselbutton\
    \ in Kopfzeile + \xFCber Klicken auf DOKUMENTATION oder \xDCBERSICHTSGRAFIK in\
    \ Kopfzeile + \xFCber Pfeil links/rechts auf der rechten Seite neben der \xDC\
    bersichtsgrafik (siehe Animation in Figma)"
  E70: "\"Entwickelt von:\" vor das ifeu-Logo (analog zu \"Gef\xF6rdert durch:\" auf\
    \ der linken Seite)"
  E71: "Impressum und Datenschutz dunkelblau und ohne graue Hinterlegung beim Dr\xFC\
    berhovern (siehe Figma). Ggf. das ifeu-Logo h\xF6her r\xFCcken (obere Kante der\
    \ anderen Logos) und dann Impressum und Datenschutz unter das Logo (siehe Vorschlag\
    \ rechts). Dann verschiebt sich die rechte Seite der Fu\xDFzeile vielleicht auch\
    \ nicht mehr unter die linke Seite, wenn man das Fenster schmaler zieht. "
  E72: "Auf der Startseite ist das Burgermen\xFC jetzt ganz au\xDFen rechts, obwohl\
    \ die Breite sonst f\xFCr alle anderen Elemente schmaler geworden ist. Auf allen\
    \ Unterseiten sieht es allerdings gut aus. Kannst du die Position des Men\xFC\
    s auf der Startseite den Unterseiten anpassen?"
  E73: "Der Abstand zwischen der \xDCberschrift und der ersten Unter\xFCberschrift\
    \ ist jetzt sehr gro\xDF. Bitte an die anderen ausklappbaren Boxen anpassen (\"\
    \xDCber das Online-Tool\" etc.)"
  E74: "Ich dachte, ich h\xE4tte den Task schon irgendwo, aber finde ihn gerade nicht\
    \ mehr: Der Link \"Umweltanforderungen\" im zweiten Absatz soll erst mal das Pop-Up\
    \ wie bei Empfehlungen 4/4 \xF6ffnen und dann erst bei der Download-Funktion die\
    \ andere PDF anzeigen"
  E75: Mini (Kleinstwagen)
  E76: "In Aufz\xE4hlung und Tabelle \"Minis (Kleinstwagen)\" mit \"Kleinstwagen\"\
    \ ersetzen. In Absatz vor Unter\xFCberschrift \"Beispiele pro Fahrzeugsegment\"\
    : \"Minis\" ersetzen mit \"Kleinst-\""
  E77: "Kannst du bei den Empfehlungen die Zeilenumbr\xFCche aus dem Tab \"Empfehlungslisten\"\
    \ \xFCbernehmen? Muss keine Leerzeile sein (wie hier in Excel), sondern einfach\
    \ ein Absatz mit kleinem Abstand. Ich hoffe, das geht automatisch und du musst\
    \ die nicht alle h\xE4ndisch erg\xE4nzen..."
  E78: "Wenn man in die Eingabefelder eine Zahl eingibt und aus Excel-Gewohnheit Enter\
    \ dr\xFCckt, erscheint der Dialog, ob alle Eingaben zur\xFCckgesetzt werden sollen.\
    \ Kannst du das rausnehmen und bei Enter einfach das Eingabefeld verlassen?"
  E79: "Die Logos von Berlin und Brandenburg sind jetzt auf einmal sehr gro\xDF -\
    \ kannst du die wieder verkleinern (siehe Figma)? Und auch der Titel \"Kontakt\"\
    \ wirkt bei mir gerade sehr gro\xDF. Vielleicht eher so wie bei Impressum und\
    \ Datenschutz von der Schriftgr\xF6\xDFe her."
  E8: "Der letzte Satz im Feld Nr. 1 \"Bitte \xFCberlegen Sie mithilfe der n\xE4chsten\
    \ Frage, ob der Fuhrpark noch weiter verkleinert werden kann.\" ist statisch und\
    \ doppelt - einfach rausnehmen (der entsprechende Satz kommt eh \xFCber die Verkn\xFC\
    pfungen in der Excel-Datei)"
  E80: "In Aufz\xE4hlung: Text in Klammern hinter \"Obere Mittelklasse\" und hinter\
    \ \"Oberklasse\" l\xF6schen"
  E81: "In Absatz \xFCber Tabelle -> erste zwei S\xE4tze ersetzen mit: \"Gerade wenn\
    \ meistens nur 1 bis 2 Personen zusammenfahren und keine gro\xDFen Gegenst\xE4\
    nde bef\xF6rdert werden sollen, sind Kleinst- und Kleinwagen aus Umweltsicht zu\
    \ bevorzugen. Falls regelm\xE4\xDFig mehrere Personen mitgenommen werden, gibt\
    \ es bereits ab der unteren Mittelklasse (Kompaktklasse) zahlreiche Autos mit\
    \ viel Platz auf der R\xFCckbank.\" (siehe sonst auch Word -> Link im Kommentar)"
  E82: "In Tabelle: Unten eine Zeile hinzuf\xFCgen: (links) \"Oberklasse\"; (rechts)\
    \ \"BMW 7er, Mercedes S-Klasse\""
  E83: "Bei Abbildungsbezeichnung: in der Klammer hinter \"(eigene Abbildung nach\
    \ (UBA 2021)\" erg\xE4nzen: \", Werte von 2017)\" -> also insgesamt neu (aber\
    \ Link \xFCber Quelle beibehalten): \"(eigene Abbildung nach (UBA 2021), Werte\
    \ von 2017)\""
  E84: "Impressum und Datenschutz in Burgermen\xFC unter \"Kontakt\" packen und damit\
    \ von der Startseite nehmen"
  E85: "Schriftgr\xF6\xDFe vom Flie\xDFtext anpassen an Schrift von den Fragen \xFC\
    ber den Tooleinstiegen; Schriftgr\xF6\xDFe der \xDCberschriften \"\xDCber das\
    \ Online-Tool\" etc. kleiner (n\xE4chst kleinere Schriftgr\xF6\xDFe von Material\
    \ Design; wenn unklar, sucht Susanne nochmal die konkrete Schriftgr\xF6\xDFe raus)"
  E86: "Wenn Zeile 85 erledigt: die 4 Balken des Akkordeonmen\xFCs im geschlossenen\
    \ Zustand schmaler machen. Abstand zwischen Tooleinstiegen und Akkordeonmen\xFC\
    \ verkleinern (Abstand wie in Figma)"
  E87: "Grafik: Blaue K\xE4sten verlinken mit Tooleinstiegen (Vor\xFCberlegungen und\
    \ Empfehlungen). Bei Umweltanforderungen das Pop-Up-Fenster mit der Tabelle \xF6\
    ffnen. Beim LZK-Rechner die Downloads im Akkordeonmen\xFC aufklappen. "
  E88: "Bei breiten Bildschirmen an den Seiten keine blaue Einrahmung, sondern nur\
    \ die Kopfzeile in Blau und darunter an den Seiten wei\xDF lassen (Breite der\
    \ Inhalte aber beibehalten wie gehabt). Bei den anderen Tooleinstiegen bleibt\
    \ es an der Seite blau (da liegt dann ja auch quasi ein wei\xDFes Feld mit abgerundeten\
    \ Ecken drauf). War etwas missverst\xE4ndlich in Figma :-)"
  E89: "Die \xDCberschriften der Eingabefelder sind zum Teil abweichend von Figma\
    \ und passen nicht immer genau. Bitte an Figma anpassen (also die unteren beiden\
    \ einfach nur \"H\xE4ufigkeit\")"
  E9: "\"verg\xF6\xDFern\" und Prozentzahl in Rot, wenn \"vergr\xF6\xDFern\" gezogen\
    \ wird; \"verkleinern\" und \"0%\" in Gelb, wenn \"verkleinern\" + 0% berechnet\
    \ wird; bei Prozentzahlen \xFCber 1000 wird zurzeit ein Komma statt Tausenderpunkt\
    \ angezeigt -> bitte zu Punkt \xE4ndern"
  E90: "Beim Feld \"Anzahl Personen\":  Ab 10 -> Feld, Feld\xFCberschrift und Zahl\
    \ rot f\xE4rben und Fehlermeldung erscheinen lassen: \"Die eingegebene Anzahl\
    \ an Personen \xFCbersteigt die maximal zul\xE4ssige Anzahl von 9 Personen in\
    \ einem als Pkw zugelassenen Fahrzeug.\""
  E91: "Die weisse Box passt sich hier nicht flexibel an die H\xF6he des Screens an,\
    \ wie bei \"Vor\xFCberlegungen\" und \"Empfehlungen\""
  E92: 'Die Icons zum switchen der Grafik sind anders als die im figma-Layout '
  E93: 'Overlay Boxen bei Fragezeichen: Close-Icons oben rechts sehen anders aus als
    bei den anderen Overlay Boxen (anderes Verhalten bei Hover, siehe Screenshot in
