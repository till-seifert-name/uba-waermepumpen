  B7: "Ein E-Auto (BEV - rein batteriebetrieben) ist bevorzugt zu beschaffen, da Reichweiten\
    \ bis 300 km mit den heute \xFCblichen E-Pkw in der Regel erzielbar sind, sodass\
    \ das Laden \xFCber Nacht ausreicht. \n\nWenn h\xE4ufiger auch mal Tagesstrecken\
    \ \xFCber 300 km zur\xFCckgelegt werden sollen und unterwegs oder am Zielort (Schnell-)\
    \ Ladem\xF6glichkeiten genutzt werden k\xF6nnen, kann das E-Auto auch auf diesen\
    \ Strecken zum Einsatz kommen. Besteht die M\xF6glichkeit zum Laden nicht, sollte\
    \ gepr\xFCft werden, ob f\xFCr die Einsatztage mit l\xE4ngeren Strecken regelm\xE4\
    \xDFig ein anderes Fahrzeug mit entsprechender Reichweite aus dem Fuhrpark genutzt\
    \ werden kann. Dieses Fahrzeug kann auch ein E-Auto mit gr\xF6\xDFerer Batterie\
    \ sein, da in h\xF6heren Preissegmenten reale 400 km Reichweite g\xE4ngig sind.\
    \ Zudem ist zu pr\xFCfen, ob die Tagesstrecken \xFCber 300 km tats\xE4chlich zum\
    \ Gro\xDFteil mit dem Pkw zur\xFCckgelegt werden m\xFCssen (aufgrund schlechter\
    \ Anbindung an den \xF6ffentlichen Verkehr oder viel Gep\xE4ck/Transportgut) oder\
    \ ob mit Bahn oder Fernbus gereist werden kann."
  B8: "Ein E-Auto (BEV - rein batteriebetrieben) ist bevorzugt zu beschaffen, da Reichweiten\
    \ bis 300 km mit den heute \xFCblichen E-Pkw in der Regel erzielbar sind, sodass\
    \ das Laden \xFCber Nacht ausreicht. \n\nWenn h\xE4ufiger auch mal Tagesstrecken\
    \ \xFCber 300 km zur\xFCckgelegt werden sollen und unterwegs oder am Zielort (Schnell-)\
    \ Ladem\xF6glichkeiten genutzt werden k\xF6nnen, kann das E-Auto auch auf diesen\
    \ Strecken zum Einsatz kommen. Zudem ist zu pr\xFCfen, ob die Tagesstrecken \xFC\
    ber 300 km tats\xE4chlich zum Gro\xDFteil mit dem Pkw zur\xFCckgelegt werden m\xFC\
    ssen (aufgrund schlechter Anbindung an den \xF6ffentlichen Verkehr oder viel Gep\xE4\
    ck/Transportgut) oder ob mit Bahn oder Fernbus gereist werden kann.\n\nIst dies\
    \ nicht der Fall und besteht keine M\xF6glichkeit zum Laden w\xE4hrend l\xE4ngerer\
    \ Strecken, kann die Beschaffung eines Plug-in-Hybrids (PHEV) sinnvoll sein. In\
    \ diesem Fall sollte jedoch darauf geachtet werden, dass bei den k\xFCrzeren Strecken,\
    \ die im Regelfall gefahren werden, ein elektrischer Fahranteil von \xFCber 70\
    \ % erzielt wird. Dazu muss ein regelm\xE4\xDFiges Laden gew\xE4hrleistet sein.\
    \ Zudem sind PHEVs eher in gr\xF6\xDFeren Fahrzeugsegmenten verf\xFCgbar. Je nach\
    \ Anwendungsfall kann ein kleiner, sparsamer Verbrenner auch aus Umweltsicht vorteilhaft\
    \ gg\xFC. einem PHEV sein. "
  B9: "Inkonsistente Eingabe: Die Aussage zur H\xE4ufigkeit l\xE4ngerer Strecken passt\
    \ nicht mit der angegeben Streckenl\xE4nge eines repr\xE4sentativen Tages zusammen.\
    \ Bitte passen Sie die Streckenl\xE4nge so an, dass sie den Fahrten im Regelfall\
    \ entspricht."
