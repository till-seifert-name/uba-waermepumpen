  E96: Icons werden nochmal ausgetauscht, siehe figma "Empfehlungen Abfrage 1 mit
    Auswertungen neue Icons"
  E97: "\"Von der \xF6ffentlichen Hand werden in Deutschland pro Jahr \xFCber 40.000\
