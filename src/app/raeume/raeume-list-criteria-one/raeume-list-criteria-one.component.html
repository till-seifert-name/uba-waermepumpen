<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="10"></app-wizard-tabs>

<!-- Content -->
<div class="row">
  <div class="col-lg-7">
    <form ngNativeValidate>
      <div class="mb-3">
        <label class="form-check-label" for="nicht_warm">Gibt es Räume, die nicht ausreichend warm werden?</label>

        <label for="raumNameKalt" class="form-label">Geben Sie diese Räume mit
          eindeutigem Namen hier an:</label>
        <div class="input-group">
          <input type="text" class="form-control" id="raumNameKalt" [(ngModel)]="newColdRoomName" name="raumNameKalt"
                 maxlength="30" minlength="2" required>
          <button class="btn btn-outline-primary" type="button" id="addRaumKalt"
                (click)="addColdRoom()" [disabled]="!newColdRoomName">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
      </div>

      <hr class="my-4">

      <!-- TODO: Klären, was einen Raum mit Außenwänden in der Berechnung denn unterscheidet -->
      <div class="mb-3">
        <label for="raumNameAussen" class="form-label">Ergänzen Sie weiterhin diejenigen Räume mit besonders vielen Außenbauteilen.</label>
        <div class="input-group">
          <input type="text" class="form-control" id="raumNameAussen" [(ngModel)]="newExteriorRoomName" name="raumNameAussen"
                 maxlength="30" minlength="2" required>
          <button class="btn btn-outline-primary" type="button" id="addRaumAussen"
                (click)="addExteriorRoom()" [disabled]="!newExteriorRoomName">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
      </div>
    </form>
  </div>
  <div class="col-lg-5 mt-4 mt-lg-0">
    <app-room-list></app-room-list>

    <!-- Spacer to prevent content from being hidden behind fixed footer -->
    <div class="pb-5 mb-5"></div>

    <!-- Footer Navigation Container -->
    <div class="navigation-footer">
      <div class="container d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" routerLink="/gebaeude/transition">
          <i class="bi bi-arrow-left me-1"></i> Zurück
        </button>
        <button type="button" class="btn btn-primary" routerLink="/raeume/liste-2">
          Weiter <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </div>
    </div>
  </div>
</div>
