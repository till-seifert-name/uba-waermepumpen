<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="40" activeRoomSubTab="gebaeude"></app-wizard-tabs>

<!-- Content -->
<h1 class="h5 mb-4">Angaben zum Raum: {{ roomName }}</h1>

<form #roomForm="ngForm" (ngSubmit)="onNext()" ngNativeValidate class="d-contents">
  <div class="mb-3 row align-items-center">
    <label for="raumflaeche" class="col-sm-5 col-form-label">
      Grundfläche des Raumes
      <!-- Accessibility: aria-label provides screen reader description for icon-only help button -->
      <button type="button"
              class="btn btn-link p-0 ms-1 text-muted"
              [ngbPopover]="extractPopupText(grid.g('IN_rooms', 'H4').toString())"
              placement="right"
              triggers="click"
              aria-label="Hilfe anzeigen">
        <i class="bi bi-question-circle"></i>
      </button>
    </label>
    <div class="col-sm-7">
      <div class="input-group">
        <input type="number" step="0.1" class="form-control text-end" id="raumflaeche"
               name="raumflaeche" [(ngModel)]="area" required
               min="0.5" max="300">
        <span class="input-group-text">m²</span>
      </div>
    </div>
  </div>
  <div class="mb-3 row align-items-center">
    <label for="raumhoehe" class="col-sm-5 col-form-label">Raumhöhe</label>
    <div class="col-sm-7">
      <div class="input-group">
        <input type="number" step="0.01" class="form-control text-end" id="raumhoehe"
               name="raumhoehe" [(ngModel)]="height" required
               min="1.8" max="8">
        <span class="input-group-text">m</span>
      </div>
    </div>
  </div>
  <div class="mb-3 row align-items-center">
    <label for="raumtemp" class="col-sm-5 col-form-label">
      Gewünschte Raumtemperatur
      <!-- Accessibility: aria-label provides screen reader description for icon-only help button -->
      <button type="button"
              class="btn btn-link p-0 ms-1 text-muted"
              [ngbPopover]="grid.g('IN_rooms', 'H6').toString()"
              placement="right"
              triggers="click"
              aria-label="Hilfe anzeigen">
        <i class="bi bi-question-circle"></i>
      </button>
    </label>
    <div class="col-sm-7">
      <div class="input-group">
        <input type="number" class="form-control text-end" id="raumtemp"
               name="raumtemp" [(ngModel)]="temperature" required
               min="12" max="32" step="1">
        <span class="input-group-text">°C</span>
      </div>
    </div>
  </div>

  <div class="mb-3 row align-items-center">
    <label for="decke_grenzt" class="col-sm-5 col-form-label">
      Decke grenzt an
      <!-- Accessibility: aria-label provides screen reader description for icon-only help button -->
      <button type="button"
              class="btn btn-link p-0 ms-1 text-muted"
              [ngbPopover]="grid.g('IN_rooms', 'H7').toString()"
              placement="right"
              triggers="click"
              aria-label="Hilfe anzeigen">
        <i class="bi bi-question-circle"></i>
      </button>
    </label>
    <div class="col-sm-7">
      <select class="form-select" id="decke_grenzt" name="decke_grenzt" [(ngModel)]="ceilingType">
        <option *ngFor="let grenze of deckenGrenzen" [value]="grenze">{{getBauteilGrenzeLabel(grenze)}}</option>
      </select>
    </div>
  </div>

  <div class="mb-3 row align-items-center">
    <label for="boden_grenzt" class="col-sm-5 col-form-label">Boden grenzt an</label>
    <div class="col-sm-7">
      <select class="form-select" id="boden_grenzt" name="boden_grenzt" [(ngModel)]="floorType">
        <option *ngFor="let grenze of bodenGrenzen" [value]="grenze">{{getBauteilGrenzeLabel(grenze)}}</option>
      </select>
    </div>
  </div>


  <!-- Spacer to prevent content from being hidden behind fixed footer -->
  <div class="pb-5 mb-5"></div>

  <!-- Footer Navigation Container -->
  <app-navigation-footer>
    <a class="btn btn-info" footer-left routerLink="/gebaeude/raeume/intro">
      <i class="bi bi-arrow-left me-1"></i> Zurück
    </a>
    <button type="submit" class="btn btn-info" footer-right>
      Weiter <i class="bi bi-arrow-right ms-1"></i>
    </button>
  </app-navigation-footer>
</form>
