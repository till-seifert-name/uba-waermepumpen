<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="20"></app-wizard-tabs>

  <!-- PO Comment Area (This would be removed in production) -->
  <div class="po-comment float-end" style="max-width: 250px;">
    Navigation zwischen Räumen jetzt über die Tabs im oberen Bereich<br>
    Die Raumliste wird aus dem zentralen Service geladen
  </div>

  <!-- Content -->
  <div class="text-center">
    <h1 class="display-5">Eingaben Raumebene – Wärmeverluste</h1>
    <p class="lead" *ngIf="selectedRoomName">für Raum: {{selectedRoomName}}</p>
    <p class="lead" *ngIf="!selectedRoomName">Bitte wählen Sie einen Raum aus</p>
  </div>

  <div class="mt-5 text-center">
    <button type="button" class="btn btn-primary ms-2 btn-lg"
            [routerLink]="['/raeume/detail-basis', selectedRoomId]"
            [disabled]="!selectedRoomId">Erfassung starten</button>
  </div>
<style>
.po-comment {
  border: 1px dashed red;
  background-color: #ffdddd;
  padding: 10px;
  margin-top: 15px;
  font-size: 0.9em;
  color: #600;
}
</style>
