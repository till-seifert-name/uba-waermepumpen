<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="20"></app-wizard-tabs>


<!-- Content -->
<div class="text-center">
  <h1 class="display-5">Eingaben Raumebene – Wärmeverluste</h1>
  <p class="lead" *ngIf="selectedRoomName">für Raum: {{ selectedRoomName }}</p>
  <p class="lead" *ngIf="!selectedRoomName">Bitte wählen Sie einen Raum aus</p>
</div>

<!-- Spacer to prevent content from being hidden behind fixed footer -->
<div class="pb-5 mb-5"></div>

<!-- Footer Navigation Container -->
<div class="navigation-footer">
  <div class="container d-flex justify-content-between">
    <button type="button" class="btn btn-secondary" routerLink="/raeume/liste-2">
      <i class="bi bi-arrow-left me-1"></i> Zurück
    </button>
    <button type="button" class="btn btn-primary"
            routerLink="/raeume/detail-basis"
            [queryParams]="{room: selectedRoomId}"
            [disabled]="!selectedRoomId">
      Weiter <i class="bi bi-arrow-right ms-1"></i>
    </button>
  </div>
</div>
