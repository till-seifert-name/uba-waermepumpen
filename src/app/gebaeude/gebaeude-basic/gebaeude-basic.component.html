<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="40"></app-wizard-tabs>

<!-- Content -->

<form (ngSubmit)="onSubmit()" ngNativeValidate>
  <div class="mb-3 row align-items-center">
    <label for="plz" class="col-sm-5 col-form-label">Standort des Gebäudes (PLZ)</label>
    <div class="col-sm-7">
      <input type="text" class="form-control" id="plz" name="plz"
             [ngModel]="grid.getCell('IN_build', 'P2')"
             (ngModelChange)="grid.setCell('IN_build', 'P2', $event)"
             [ngModelOptions]="{ updateOn: 'blur' }"
             pattern="[0-9]{5}">
    </div>
  </div>

  <div class="mb-3 row">
    <label class="col-sm-5 col-form-label">Das Gebäude ist ein ...</label>
    <div class="col-sm-7">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gebaeudetyp" id="typ_efh"
               [value]="'Ein- oder Zweifamilienhaus'"
               [checked]="grid.getCell('IN_build', 'P3') === 'Ein- oder Zweifamilienhaus'"
               (change)="grid.setCell('IN_build', 'P3', 'Ein- oder Zweifamilienhaus')">
        <label class="form-check-label" for="typ_efh">Ein- oder Zweifamilienhaus</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gebaeudetyp" id="typ_rh"
               [value]="'Reihenhaus'"
               [checked]="grid.getCell('IN_build', 'P3') === 'Reihenhaus'"
               (change)="grid.setCell('IN_build', 'P3', 'Reihenhaus')">
        <label class="form-check-label" for="typ_rh">Reihenhaus</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gebaeudetyp" id="typ_mfh"
               [value]="'Mehrfamilienhaus'"
               [checked]="grid.getCell('IN_build', 'P3') === 'Mehrfamilienhaus'"
               (change)="grid.setCell('IN_build', 'P3', 'Mehrfamilienhaus')">
        <label class="form-check-label" for="typ_mfh">Mehrfamilienhaus</label>
      </div>
    </div>
  </div>

  <div class="mb-3 row">
    <label class="col-sm-5 col-form-label">Dachform</label>
    <div class="col-sm-7">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dachform" id="dach_flach"
               [value]="'Flach bzw. Flachdach'"
               [checked]="grid.getCell('IN_build', 'P4') === 'Flach bzw. Flachdach'"
               (change)="grid.setCell('IN_build', 'P4', 'Flach bzw. Flachdach')">
        <label class="form-check-label" for="dach_flach">Flach oder Flachdach</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dachform" id="dach_geneigt"
               [value]="'geneigt'"
               [checked]="grid.getCell('IN_build', 'P4') === 'geneigt'"
               (change)="grid.setCell('IN_build', 'P4', 'geneigt')">
        <label class="form-check-label" for="dach_geneigt">geneigt</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dachform" id="dach_steil"
               [value]="'steil'"
               [checked]="grid.getCell('IN_build', 'P4') === 'steil'"
               (change)="grid.setCell('IN_build', 'P4', 'steil')">
        <label class="form-check-label" for="dach_steil">steil</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dachform" id="dach_sehrsteil"
               [value]="'sehr steil'"
               [checked]="grid.getCell('IN_build', 'P4') === 'sehr steil'"
               (change)="grid.setCell('IN_build', 'P4', 'sehr steil')">
        <label class="form-check-label" for="dach_sehrsteil">sehr steil</label>
      </div>
    </div>
  </div>

  <div class="mb-3 row align-items-center">
    <label for="baujahr" class="col-sm-5 col-form-label">Baujahr</label>
    <div class="col-sm-7">
      <select class="form-select" id="baujahr" name="baujahr"
              [ngModel]="grid.getCell('IN_build', 'P5')"
              (ngModelChange)="grid.setCell('IN_build', 'P5', $event)">
        <option value="" selected>Bitte auswählen</option>
        <option *ngFor="let jahr of baualtersklassen" [value]="jahr">{{jahr}}</option>
      </select>
    </div>
  </div>

  <!-- Spacer to prevent content from being hidden behind fixed footer -->
  <div class="pb-5 mb-5"></div>

  <!-- Footer Navigation Container -->
  <div class="navigation-footer">
    <div class="container d-flex justify-content-between">
      <button type="button" class="btn btn-secondary" routerLink="/gebaeude">
        <i class="bi bi-arrow-left me-1"></i> Zurück
      </button>
      <button type="submit" class="btn btn-primary">
        Weiter <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </div>
  </div>
</form>
