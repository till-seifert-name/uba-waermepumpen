<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="40"></app-wizard-tabs>

<!-- Content -->

<form (ngSubmit)="onSubmit()" ngNativeValidate>
  <div class="mb-3 row align-items-center">
    <label for="plz" class="col-sm-5 col-form-label">Standort des Gebäudes (PLZ)</label>
    <div class="col-sm-7">
      <input type="text" class="form-control" id="plz" name="plz"
             [ngModel]="grid.getCell('IN_build', 'P2')"
             (ngModelChange)="grid.setCell('IN_build', 'P2', $event)"
             [ngModelOptions]="{ updateOn: 'blur' }"
             pattern="[0-9]{5}">
    </div>
  </div>

  <div class="mb-3 row">
    <label class="col-sm-5 col-form-label">Das Gebäude ist ein ...</label>
    <div class="col-sm-7">
      <div *ngFor="let gebaeudetyp of gebaeudetypen; let i = index" class="form-check">
        <input class="form-check-input" type="radio" name="gebaeudetyp" [id]="'typ_' + i"
               [value]="gebaeudetyp"
               [checked]="grid.getCell('IN_build', 'P3') === gebaeudetyp"
               (change)="grid.setCell('IN_build', 'P3', gebaeudetyp)">
        <label class="form-check-label" [for]="'typ_' + i">{{gebaeudetyp}}</label>
      </div>
    </div>
  </div>

  <div class="mb-3 row">
    <label class="col-sm-5 col-form-label">Dachform</label>
    <div class="col-sm-7">
      <div *ngFor="let dachtyp of dachtypen; let i = index" class="form-check">
        <input class="form-check-input" type="radio" name="dachform" [id]="'dach_' + i"
               [value]="dachtyp"
               [checked]="grid.getCell('IN_build', 'P4') === dachtyp"
               (change)="grid.setCell('IN_build', 'P4', dachtyp)">
        <label class="form-check-label" [for]="'dach_' + i">{{dachtyp}}</label>
      </div>
    </div>
  </div>

  <div class="mb-3 row align-items-center">
    <label for="baujahr" class="col-sm-5 col-form-label">Baujahr</label>
    <div class="col-sm-7">
      <select class="form-select text-end" id="baujahr" name="baujahr"
              [ngModel]="grid.getCell('IN_build', 'P5')"
              (ngModelChange)="grid.setCell('IN_build', 'P5', $event)"
              required>
        <option *ngFor="let jahr of baualtersklassen" [value]="jahr">{{getBaualtersklasseLabel(jahr)}}</option>
      </select>
    </div>
  </div>

  <!-- Spacer to prevent content from being hidden behind fixed footer -->
  <div class="pb-5 mb-5"></div>

  <!-- Footer Navigation Container -->
  <div class="navigation-footer">
    <div class="container d-flex justify-content-between">
      <button type="button" class="btn btn-secondary" routerLink="/gebaeude">
        <i class="bi bi-arrow-left me-1"></i> Zurück
      </button>
      <button type="submit" class="btn btn-primary">
        Weiter <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </div>
  </div>
</form>
