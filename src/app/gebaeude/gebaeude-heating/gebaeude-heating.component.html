<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="65"></app-wizard-tabs>

<!-- Content -->
<form (ngSubmit)="onSubmit()" ngNativeValidate>
  <div class="mb-4 row align-items-center">
    <label for="effizienz" class="col-sm-5 col-form-label">Ist Ihnen die Effizienzklasse bekannt?</label>
    <div class="col-sm-7">
      <select class="form-select" id="effizienz" name="effizienz" [(ngModel)]="heatingData.efficiencyClass">
        <option value="" selected>Bitte auswählen</option>
        <option value="A+">A+</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="G">G</option>
        <option value="H">H</option>
        <option value="nein">Nein / Nicht bekannt</option>
      </select>
    </div>
  </div>

  <div class="mb-4 form-check form-switch ps-0">
    <label class="form-check-label" for="denkmalschutz">Das Gebäude steht unter Denkmalschutz</label>
    <input class="form-check-input float-end me-1" type="checkbox" role="switch" id="denkmalschutz"
           name="denkmalschutz" [(ngModel)]="heatingData.historicBuilding">
  </div>

  <hr class="my-4">

  <div class="mb-4 row">
    <label class="col-sm-5 col-form-label pt-0">Wie werden die Räume erwärmt?</label>
    <div class="col-sm-7">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="heizungsart" id="heiz_hk"
               [(ngModel)]="heatingData.heatingType" value="radiator" checked>
        <label class="form-check-label" for="heiz_hk">Heizkörper</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="heizungsart" id="heiz_fbh"
               [(ngModel)]="heatingData.heatingType" value="floor">
        <label class="form-check-label" for="heiz_fbh">Fußbodenheizung (Flächenheizung)</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="heizungsart" id="heiz_kombi"
               [(ngModel)]="heatingData.heatingType" value="combined">
        <label class="form-check-label" for="heiz_kombi">Heizkörper und Flächenheizung</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="heizungsart" id="heiz_nacht"
               [(ngModel)]="heatingData.heatingType" value="storage">
        <label class="form-check-label" for="heiz_nacht">Nachtspeicherheizung (Stromdirektheizung)</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="heizungsart" id="heiz_andere"
               [(ngModel)]="heatingData.heatingType" value="other">
        <label class="form-check-label" for="heiz_andere">Andere</label>
      </div>
    </div>
  </div>

  <div class="mb-3 row">
    <label class="col-sm-5 col-form-label pt-0">Wie wird die Wärme verteilt?</label>
    <div class="col-sm-7">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="verteilung" id="verteil_zwei"
               [(ngModel)]="heatingData.distributionType" value="zwei" checked>
        <label class="form-check-label" for="verteil_zwei">Zweirohrheizung</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="verteilung" id="verteil_ein"
               [(ngModel)]="heatingData.distributionType" value="ein">
        <label class="form-check-label" for="verteil_ein">Einrohrheizung</label>
      </div>
    </div>
  </div>

  <div class="text-end mt-4">
    <button type="button" class="btn btn-secondary" routerLink="/gebaeude/modernisierung">Zurück</button>
    <button type="submit" class="btn btn-primary ms-2">Weiter</button>
  </div>
</form>
