<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Raumliste</span>
    <small class="text-muted"><i class="bi bi-info-circle"></i> Raumnamen anklicken zum Bearbeiten</small>
  </div>
  <ul class="list-group list-group-flush" id="raumListeDisplay">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let room of berechnungService.getAllRooms(); let isLast = last">
      <div class="editable-room-name"
           #editableField
           [contentEditable]="true"
           (blur)="renameRoom(room.id, editableField.textContent || ''); editableField.textContent = room.name"
           title="Klicken zum Bearbeiten - der Name darf nicht leer sein">
        {{room.name}}
      </div>
      <div class="btn-group">
        <button class="btn btn-sm btn-outline-danger"
             (click)="removeRoom(room.id)"
             *ngIf="isLast"
             title="{{isLast ? 'Raum entfernen' : 'Nur der letzte Raum kann entfernt werden'}}">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </li>
    <li class="list-group-item list-group-item-secondary text-center" *ngIf="berechnungService.getAllRooms().length === 0">
      Noch keine Räume hinzugefügt
    </li>
  </ul>
</div>
