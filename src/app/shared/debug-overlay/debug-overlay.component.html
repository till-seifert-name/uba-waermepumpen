<div class="position-fixed bottom-0 end-0 m-4 p-2 bg-light border rounded shadow" style="width: 30rem; max-height: 80vh; overflow-y: auto; z-index: 9999;" *ngIf="isVisible">
  <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
    <h5 class="m-0">Debug-Overlay</h5>
    <button type="button" class="btn-close" aria-label="Schließen" (click)="toggleVisibility()"></button>
  </div>

  <div class="table-responsive mb-1">
    <table class="table table-sm table-striped mb-0">
      <thead class="table-light">
        <tr>
          <th>Blatt</th>
          <th>Zelle</th>
          <th>Wert</th>
          <th class="text-center" style="width: 50px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cellRef of cellReferences; let i = index">
          <td>
            <select class="form-select form-select-sm" [(ngModel)]="cellRef.sheet" (change)="onInputChange()" [name]="'sheet-' + i">
              <option value="">-- Blatt wählen --</option>
              <option *ngFor="let sheet of sheetNames" [value]="sheet">{{ sheet }}</option>
            </select>
          </td>
          <td>
            <input type="text" class="form-control form-control-sm font-monospace" placeholder="z.B. A1"
                   style="width: 4em"
                   [(ngModel)]="cellRef.cell" (input)="onInputChange()" [name]="'cell-' + i">
          </td>
          <td class="font-monospace align-content-center" [title]="cellRef.value | json">
            <div *ngIf="cellRef.sheet && cellRef.cell" class="overflow-hidden text-break small" style="max-width: 20em">
              {{ cellRef.value | json }}
            </div>
            <div class="text-muted" *ngIf="!cellRef.sheet || !cellRef.cell">
              <small>-</small>
            </div>
          </td>
          <td class="text-center">
            <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeCellRef(i)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex gap-2">
    <button type="button" class="btn btn-primary btn-sm flex-fill d-flex align-items-center justify-content-center gap-1" (click)="addCellRef()">
      <i class="bi bi-plus-circle"></i> Zellreferenz hinzufügen
    </button>
    <button type="button" class="btn btn-success btn-sm flex-fill d-flex align-items-center justify-content-center gap-1" (click)="downloadResults()">
      <i class="bi bi-download"></i> Ergebnisse herunterladen
    </button>
  </div>

  <div class="text-center mt-2" *ngIf="cellReferences.length === 0">
    <small class="text-muted">Blattnamen und die Zellreferenz eingeben, um Wert anzuzeigen</small>
  </div>
</div>
