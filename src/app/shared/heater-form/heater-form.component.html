<div *ngIf="visible" class="mb-4">
  <h6>Heizfläche {{ heaterNumber }}</h6>

  <!-- Heater Type Grid Selection -->
  <div class="mb-3">
    <label class="form-label">Typ</label>
    <div class="heater-type-grid">
      <ng-container *ngFor="let type of heatingTypeOptions">
        <div class="heater-type-option">
          <input type="radio" class="btn-check" [id]="'heater' + heaterNumber + '_type_' + type"
                 [name]="'heater' + heaterNumber + '_type'"
                 [value]="type" [checked]="berechnungService.getHeatingType(roomId, heaterNumber) === type"
                 (change)="onHeaterTypeChange(type)">
          <label [for]="'heater' + heaterNumber + '_type_' + type" class="btn btn-outline-secondary d-block p-2">
            <div class="border rounded mb-2 image-container">
              <!-- Placeholder for images - to be replaced with SVG later -->
              <div *ngIf="type === 'Flachheizkoerper_senkrecht_profiliert'" class="placeholder-image">
                <svg width="80" height="80" viewBox="0 0 100 100">
                  <rect x="30" y="10" width="40" height="80" fill="#eee" stroke="#666" stroke-width="2"/>
                  <line x1="37" y1="15" x2="37" y2="85" stroke="#666" stroke-width="2"/>
                  <line x1="45" y1="15" x2="45" y2="85" stroke="#666" stroke-width="2"/>
                  <line x1="53" y1="15" x2="53" y2="85" stroke="#666" stroke-width="2"/>
                  <line x1="61" y1="15" x2="61" y2="85" stroke="#666" stroke-width="2"/>
                  <circle cx="70" cy="75" r="5" fill="none" stroke="#666" stroke-width="2"/>
                </svg>
              </div>
              <div *ngIf="type === 'Flachheizkoerper_glatt'" class="placeholder-image">
                <svg width="80" height="80" viewBox="0 0 100 100">
                  <rect x="30" y="10" width="40" height="80" fill="#eee" stroke="#666" stroke-width="2"/>
                  <circle cx="70" cy="75" r="5" fill="none" stroke="#666" stroke-width="2"/>
                </svg>
              </div>
              <div *ngIf="type === 'Gliederheizkörper'" class="placeholder-image">
                <svg width="80" height="80" viewBox="0 0 100 100">
                  <path d="M20,10 v80 M30,10 v80 M40,10 v80 M50,10 v80 M60,10 v80 M70,10 v80 M80,10 v80" stroke="#666" stroke-width="4"/>
                  <path d="M20,10 h60 M20,90 h60" stroke="#666" stroke-width="2"/>
                  <circle cx="80" cy="75" r="5" fill="none" stroke="#666" stroke-width="2"/>
                </svg>
              </div>
              <div *ngIf="type === 'Rohrradiator'" class="placeholder-image">
                <svg width="80" height="80" viewBox="0 0 100 100">
                  <path d="M20,20 h60 M20,35 h60 M20,50 h60 M20,65 h60 M20,80 h60" stroke="#666" stroke-width="3" fill="none"/>
                  <path d="M20,20 v60 M80,20 v60" stroke="#666" stroke-width="3" fill="none"/>
                  <circle cx="80" cy="65" r="5" fill="none" stroke="#666" stroke-width="2"/>
                </svg>
              </div>
              <div *ngIf="type === 'Rohrheizkörper'" class="placeholder-image">
                <svg width="80" height="80" viewBox="0 0 100 100">
                  <path d="M20,20 h60 M20,30 h60 M20,40 h60 M20,50 h60 M20,60 h60 M20,70 h60 M20,80 h60" stroke="#666" stroke-width="3" fill="none"/>
                  <path d="M20,20 v60 M80,20 v60" stroke="#666" stroke-width="3" fill="none"/>
                  <circle cx="80" cy="75" r="5" fill="none" stroke="#666" stroke-width="2"/>
                </svg>
              </div>
              <div *ngIf="type === 'Konvektor'" class="placeholder-image">
                <svg width="80" height="80" viewBox="0 0 100 100">
                  <rect x="20" y="20" width="60" height="60" fill="#eee" stroke="#666" stroke-width="2"/>
                  <line x1="20" y1="40" x2="80" y2="40" stroke="#666" stroke-width="1"/>
                  <circle cx="80" cy="75" r="5" fill="none" stroke="#666" stroke-width="2"/>
                </svg>
              </div>
            </div>
            <small>{{ getHeaterTypeDisplayName(type) }}</small>
          </label>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Heater Details Form -->
  <div class="row g-3 mt-1">
    <!-- Subtyp - für alle Typen -->
    <div class="col-6 mb-3">
      <div class="input-group">
        <span class="input-group-text" style="width: 90px;">Subtyp</span>
        <select class="form-select"
                [(ngModel)]="heaterSubtype"
                (ngModelChange)="updateDimensionOptions()"
                [name]="'heater' + heaterNumber + '_subtype'" required>
          <option *ngFor="let subtype of berechnungService.getHeaterSubtypes(berechnungService.getHeatingType(roomId, heaterNumber))"
                  [value]="subtype">{{ subtype }}</option>
        </select>
      </div>
    </div>
    <!-- Anzahl identische Heizkörper -->
    <div class="col-6 mb-3">
      <div class="input-group">
        <span class="input-group-text" style="width: 90px;">Anzahl</span>
        <input type="number" class="form-control"
               [ngModel]="berechnungService.getHeatingCount(roomId, heaterNumber) || 1"
               (ngModelChange)="berechnungService.setHeatingCount(roomId, $event, heaterNumber)"
               [name]="'heater' + heaterNumber + '_count'" min="1" max="20" step="1" required>
      </div>
      <div class="form-text">Anzahl identischer Heizkörper im Raum</div>
    </div>

    <!-- Abmessungen - mit unterschiedlichen Bedingungen pro Typ -->
    <div class="row g-2">
      <!-- Breite/Länge - nur bei bestimmten Typen -->
      <div class="col mb-3" *ngIf="widthOptions.length > 0">
        <div class="input-group">
          <span class="input-group-text" style="width: 90px;">Breite</span>
          <!-- Select dropdown if we have standard width options -->
          <select class="form-select"
                 [ngModel]="berechnungService.getHeatingLength(roomId, heaterNumber)"
                 (ngModelChange)="berechnungService.setHeatingLength(roomId, $event, heaterNumber)"
                 [name]="'heater' + heaterNumber + '_length'" required>
            <option *ngFor="let width of widthOptions" [ngValue]="width">{{ width }} cm</option>
          </select>
        </div>
      </div>

      <!-- Höhe - für alle Typen -->
      <div class="col mb-3" *ngIf="heightOptions.length > 0">
        <div class="input-group">
          <span class="input-group-text" style="width: 90px;">Höhe</span>
          <!-- Select dropdown if we have standard height options -->
          <select class="form-select"
                 [ngModel]="berechnungService.getHeatingHeight(roomId, heaterNumber)"
                 (ngModelChange)="berechnungService.setHeatingHeight(roomId, $event, heaterNumber)"
                 [name]="'heater' + heaterNumber + '_height'" required>
            <option *ngFor="let height of heightOptions" [ngValue]="height">{{ height }} cm</option>
          </select>
        </div>
      </div>

      <!-- Tiefe - nur bei bestimmten Typen -->
      <div class="col mb-3" *ngIf="depthOptions.length > 0">
        <div class="input-group">
          <span class="input-group-text" style="width: 90px;">Tiefe</span>
          <!-- Select dropdown if we have standard depth options -->
          <select class="form-select"
                 [ngModel]="berechnungService.getHeatingDepth(roomId, heaterNumber)"
                 (ngModelChange)="berechnungService.setHeatingDepth(roomId, $event, heaterNumber)"
                 [name]="'heater' + heaterNumber + '_depth'" required>
            <option *ngFor="let depth of depthOptions" [ngValue]="depth">{{ depth }} cm</option>
          </select>
        </div>
      </div>

      <!-- Anzahl Glieder - nur bei Gliederheizkörper -->
      <div class="col mb-3" *ngIf="berechnungService.getHeatingType(roomId, heaterNumber) === 'Gliederheizkörper'">
        <div class="input-group">
          <span class="input-group-text" style="width: 90px;">Glieder</span>
          <!-- Number input -->
          <input type="number" class="form-control"
                 [ngModel]="berechnungService.getn_rad_col(roomId, heaterNumber) || 10"
                 (ngModelChange)="berechnungService.setn_rad_col(roomId, $event, heaterNumber)"
                 [name]="'n_rad' + heaterNumber + '_col'" min="1" max="20" step="1" required>
        </div>
        <div class="form-text">Geben Sie die Anzahl der Glieder des Heizkörpers an</div>
      </div>

    </div>
  </div>

  <!-- Remove Button -->
  <div class="text-end mt-3">
    <button type="button" class="btn btn-sm btn-outline-danger" (click)="onRemove()">
      <i class="bi bi-trash"></i> Entfernen
    </button>
  </div>
</div>
