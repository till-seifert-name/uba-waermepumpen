<!-- Wizard Tabs -->
<app-wizard-tabs [progress]="100"></app-wizard-tabs>

  <!-- Content -->
  <h3 class="mb-3">Ergebnis</h3>

  <!-- Suitability Assessment -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white">Eignungsbewertung für Wärmepumpe</div>
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-md-3 text-center">
          <div class="display-1" [ngClass]="{
            'text-success': assessmentResult.suitability === 'high',
            'text-warning': assessmentResult.suitability === 'medium',
            'text-danger': assessmentResult.suitability === 'low'
          }">
            <i class="bi" [ngClass]="{
              'bi-check-circle-fill': assessmentResult.suitability === 'high',
              'bi-exclamation-triangle-fill': assessmentResult.suitability === 'medium',
              'bi-x-circle-fill': assessmentResult.suitability === 'low'
            }"></i>
          </div>
          <h4 class="mt-2" [ngClass]="{
            'text-success': assessmentResult.suitability === 'high',
            'text-warning': assessmentResult.suitability === 'medium',
            'text-danger': assessmentResult.suitability === 'low'
          }">
            {{assessmentResult.suitabilityText}}
          </h4>
        </div>
        <div class="col-md-9">
          <p>{{assessmentResult.summary}}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Spacer to prevent content from being hidden behind fixed footer -->
  <div class="pb-5 mb-5"></div>
  
  <!-- Footer Navigation Container -->
  <div class="navigation-footer">
    <div class="container d-flex justify-content-between">
      <button type="button" class="btn btn-secondary" routerLink="/raeume/intro">
        <i class="bi bi-arrow-left me-1"></i> Zurück
      </button>
      <button type="button" class="btn btn-success">
        <i class="bi bi-download me-1"></i> Speichern
      </button>
    </div>
  </div>
