<mat-menu #menu="matMenu">
  <a mat-menu-item routerLink="/"
     routerLinkActive="mdc-list-item--activated" [routerLinkActiveOptions]="{ exact: true }">
    Startseite
  </a>
  <a mat-menu-item routerLink="/hintergrundinformationen"
     routerLinkActive="mdc-list-item--activated">
    Hintergrundinformationen
  </a>
  <a mat-menu-item routerLink="/vorueberlegungen"
     routerLinkActive="mdc-list-item--activated">
    Vorüberlegungen
  </a>
  <a mat-menu-item routerLink="/empfehlungen"
     routerLinkActive="mdc-list-item--activated">
    Empfehlungen
  </a>
  <mat-divider></mat-divider>
  <a mat-menu-item routerLink="/kontakt"
     routerLinkActive="mdc-list-item--activated">
    Kontakt
  </a>
</mat-menu>

<span class="visually-hidden"
      routerLink="/"
      routerLinkActive="root-route-is-active"
      [routerLinkActiveOptions]="{ exact: true }"
></span>

<!-- Toolbar -->
<mat-toolbar class="position-sticky top-0 flex-shrink-0 fixed-top justify-content-end bg-dark text-bg-dark">

  <span id="title" class="flex-grow-1 mat-body-2" routerLink="/">
    Umweltverträgliche Mobilität für die öffentliche Hand
  </span>

  <button class="text-bg-dark bg-dark" mat-icon-button [matMenuTriggerFor]="menu">
    <mat-icon class="material-icons-outlined">menu</mat-icon>
  </button>

</mat-toolbar>

<div class="flex-grow-1 d-flex flex-column bg-dark">

  <router-outlet></router-outlet>

</div>
