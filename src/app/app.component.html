<mat-sidenav-container>
  <mat-sidenav #sidenav mode="over">
    <mat-nav-list>
      <a mat-list-item [activated]="true" routerLink="/"
         routerLinkActive="mdc-list-item--activated" [routerLinkActiveOptions]="{ exact: true }">
        Startseite
      </a>
      <a mat-list-item routerLink="/hintergrundinformationen"
         routerLinkActive="mdc-list-item--activated">
        Hintergrundinformationen
      </a>
      <a mat-list-item routerLink="/vorueberlegungen"
         routerLinkActive="mdc-list-item--activated">
        Vorüberlegungen
      </a>
      <a mat-list-item routerLink="/empfehlungen"
         routerLinkActive="mdc-list-item--activated">
        Empfehlungen
      </a>
      <mat-divider></mat-divider>
      <a mat-list-item routerLink="/kontakt"
         routerLinkActive="mdc-list-item--activated">
        Kontakt
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="vh-100 d-flex flex-column">

    <span class="visually-hidden"
          routerLink="/"
          routerLinkActive="root-route-is-active"
          [routerLinkActiveOptions]="{ exact: true }"
    ></span>

    <!-- Toolbar -->
    <mat-toolbar class="position-sticky top-0 flex-shrink-0 fixed-top">
      <button mat-icon-button aria-label="Menü öffnen…" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span id="title" class="flex-grow-1 text-center" routerLink="/">
        Umweltverträgliche Mobilität für die öffentliche Hand
      </span>
    </mat-toolbar>


    <div class="container-fluid flex-grow-1 d-flex flex-column">

      <router-outlet></router-outlet>

    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
