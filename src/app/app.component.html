<!-- Main Content -->
<div class="content-wrapper pt-3 flex-fill d-flex flex-column">
  <!-- Global container for main content -->
  <div class="container-fluid flex-fill d-flex flex-column">
    <router-outlet></router-outlet>
  </div>
</div>

<!-- Hidden forms - can be triggered from any component -->
<form id="exportForm" (ngSubmit)="exportData()" style="display: none;" aria-hidden="true"></form>
<form id="importForm" (ngSubmit)="triggerImport()" style="display: none;" aria-hidden="true"></form>
<form id="resetForm" (ngSubmit)="resetData()" style="display: none;" aria-hidden="true"></form>
<input #fileInput type="file" accept=".json" (change)="importData($event)" style="display: none;" aria-hidden="true">

<!-- Debug Overlay - Toggle with Meta+D -->
<app-debug-overlay class="d-print-none"></app-debug-overlay>
