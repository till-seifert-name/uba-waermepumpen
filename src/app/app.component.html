          <button class="btn btn-link nav-link" (click)="triggerImport()" title="Daten importieren">

          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Startseite</a>

        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/impressum" routerLinkActive="active">Impressum</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/datenschutz" routerLinkActive="active">Datenschutz</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="content-wrapper mt-5 pt-3">
  <!-- Global container for main content -->
  <div class="container">
